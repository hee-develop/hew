# 가상의 서비스(판매자·구매자·포인트·적립률이 있는 중개 서비스)로 채운 예시입니다.
# 실제 값은 저장소 밖 프로필 폴더에 둡니다(환경 변수 HEW_PROFILE_DIR 또는 ~/.hew/profile).
# 이 폴더(profiles/example)는 위 두 곳이 모두 없을 때 쓰는 끝 기본값입니다.

# 주체 판정 낱말. 값은 정규식 조각이고 대소문자를 가리지 않습니다. 여러 개는 | 로 합칩니다.
# operator 는 사내 어드민 작업자(모바일 작업 범위 밖), provider 는 제공하는 쪽, customer 는 이용하는 쪽입니다.
actors:
  operator: ["운영자", "관리자", "어드민", "admin"]
  provider: ["판매자"]
  customer: ["구매자"]

# 티켓 분해 규칙
plan:
  # SP 범위(벗어나면 경고)와 1SP 가 몇 시간인지
  sp: { min: 2, max: 4, hours_per_sp: 1 }
  title:
    # 티켓 제목 형식. {epic}(일감명)이 {summary}(작업 요약)보다 앞에 있어야 하고 둘 다 필요합니다.
    format: "[MO] {epic} / {summary}"
  # PR 묶음 하나의 티켓 상한과 기본 base 브랜치
  pr: { max_tickets: 6, base: develop }
  # 선택. 패킷의 '팀 규칙' 절에 그대로 실리는 줄
  notes: ["스쿼드 접두어는 붙이지 않는다"]

# 역할별 규칙 노트 id(패킷의 '따를 규칙' 절). 없는 역할은 빈 목록입니다.
heka:
  technical-manager:
    - requirement-source-priority-figma-first
    - hew-2026-10-21-figma-prd
    - hew-scope-operator-journeys-excluded-2026-10-29
    - hew-delta-comparison-rows-2026-10-28
    - hew-2026-10-21-follow-figma
    - hew-2026-10-21-requirement-ids
    - hew-id-labels-korean
    - figma-mcp-read-procedure
    - figma-instance-app-3099
    - figma-to-mobile-component-lookup
  ticket-maker:
    - jira-ticket-title-format
    - jira-mo-ticket-body-format
    - app-team-feature-flag-replaces-epic-branch
    - app-feature-story-role-prefixed-subtasks
    - small-commits
    - commit-split-ui-and-feature
  collector:
    - figma-mcp-read-procedure
    - confluence-page-version-body-via-atlassian-mcp

# 외부 서비스 연결 값
connections:
  # Atlassian cloudId(사이트 주소로도 쓸 수 있습니다)
  atlassian_cloud_id: example.atlassian.net
