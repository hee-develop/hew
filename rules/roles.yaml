# 역할별 실행 설정. 모델·effort 는 환경 변수 HEW_MODEL_<역할>, HEW_EFFORT_<역할> 로 덮어쓸 수 있다.
roles:
  technical-manager:
    model: claude-opus-5-5
    effort: high
    isolated: true
    allowed_tools: [Read, Write, Edit, Bash]
    timeout_minutes: 90
    refs:
      - refs/analysis-format.md
      - refs/analysis.example.json
      - refs/analysis.example.units.json
  qa-designer:
    model: claude-opus-5-5
    effort: high
    isolated: true
    allowed_tools: [Read, Write, Edit, Bash]
    timeout_minutes: 60
    refs:
      - refs/scenarios-format.md
      - refs/scenarios.example.json
      - refs/analysis.example.json
  ticket-maker:
    model: claude-sonnet-5-5
    effort: medium
    isolated: true
    allowed_tools: [Read, Write, Edit, Bash]
    timeout_minutes: 45
    refs:
      - refs/plan-format.md
      - refs/plan.example.json
      - rules/plan.yaml
  manager-sasu:
    model: claude-haiku-5-5
    isolated: true
    allowed_tools: [Read, Write, Bash]
    timeout_minutes: 20
    refs:
      - refs/findings-format.md
      - refs/findings.example.json
      - refs/sasu-batch.example.json
  ticket-sasu:
    model: claude-haiku-5-5
    isolated: true
    allowed_tools: [Read, Write, Bash]
    timeout_minutes: 20
    refs:
      - refs/findings-format.md
      - refs/findings.plan.example.json
      - refs/sasu-batch.plan.example.json
  collector:
    model: claude-sonnet-5-5
    effort: medium
    isolated: false
    allowed_tools: [Read, Bash, ToolSearch]
    timeout_minutes: 45
    refs: []
