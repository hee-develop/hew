# 티켓 분해 규칙 중 프로필과 무관한 것. SP 범위·제목 형식·PR 상한은 프로필의 plan 에 있다.
# src/core/plan/checks.ts 가 읽어 결정적으로 검사한다.
# 티켓 본문(배경·작업 내용·확인 사항·선행 의존)에 있으면 안 되는 것의 정규식.
body_forbidden:
  - pattern: "\\.(ts|tsx|js|jsx|json|kt|swift)\\b"
    label: 파일 확장자
  - pattern: "\\b(app|src)/[\\w./-]+"
    label: 파일 경로
  - pattern: "[\\w/-]+\\.\\w+:\\d+\\b"
    label: 경로 뒤의 줄 번호
  - pattern: "line \\d+"
    label: 줄 번호
  - pattern: "\\d+번째 줄"
    label: 줄 번호
  - pattern: "\\b[a-zA-Z_][\\w.]*\\(\\)"
    label: 함수 호출
