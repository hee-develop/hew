<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --line: #d9dde3;
  --ink: #1b1f27;
  --ink-2: #4a5160;
  --ink-3: #626a7a;
  --accent: #1f4fd8;
  --accent-ink: #ffffff;
  --accent-bg: #e6edff;
  --good: #11693f;
  --good-bg: #e0f3e8;
  --warn: #7c4b00;
  --warn-bg: #fdf0d3;
  --crit: #a8202f;
  --crit-bg: #fce6e9;
  --flash: #fff3b8;
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bar-h: 56px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1218;
    --surface: #171b24;
    --surface-2: #1e2430;
    --line: #2d3443;
    --ink: #e6e9f0;
    --ink-2: #b6bdcc;
    --ink-3: #98a0b3;
    --accent: #9db2ff;
    --accent-ink: #0c1230;
    --accent-bg: #1d2750;
    --good: #66d19f;
    --good-bg: #153023;
    --warn: #ebbd5e;
    --warn-bg: #3a2c0e;
    --crit: #ff9aa4;
    --crit-bg: #3e1822;
    --flash: #4a4210;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: auto; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font); }
a { color: var(--accent); }
button, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.35; }
h2 { font-size: 20px; margin-bottom: 12px; }
h3 { font-size: 16px; }
h4 { font-size: 15px; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 20px; }
.top { padding: 20px 0 12px; }
.top h1 { font-size: 24px; }
.meta { color: var(--ink-3); font-size: 13px; margin-top: 4px; }
.bar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: 0 1px 0 rgba(0,0,0,.03); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-top: 8px; padding-bottom: 8px; }
.bar nav { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 13px; flex: 1 1 320px; }
.bar nav a { text-decoration: none; color: var(--ink-2); padding: 2px 4px; border-radius: 4px; }
.bar nav a:hover { background: var(--surface-2); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.chip { display: inline-block; font-size: 12px; line-height: 1.5; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.good { background: var(--good-bg); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.chip.crit { background: var(--crit-bg); color: var(--crit); border-color: transparent; }
.chip.accent { background: var(--accent-bg); color: var(--accent); border-color: transparent; }
a.chip { text-decoration: none; }
a.chip:hover { border-color: var(--accent); }
a.chip.is-open { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.progress { display: flex; flex-wrap: wrap; gap: 6px; }
main { padding-bottom: 80px; }
section.sec { margin-top: 28px; scroll-margin-top: calc(var(--bar-h) + 12px); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.card + .card { margin-top: 12px; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.row.gap-sm { gap: 4px 6px; }
.stack > * + * { margin-top: 10px; }
details > summary { cursor: pointer; color: var(--ink-2); }
details > summary:hover { color: var(--ink); }
details.fold { margin-top: 8px; font-size: 14px; }
details.fold > :not(summary) { margin-top: 6px; }
details.ai { background: var(--surface-2); border-radius: 8px; padding: 6px 10px; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { background: var(--flash); } 100% { background: transparent; } }
[id] { scroll-margin-top: calc(var(--bar-h) + 12px); }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tab { border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 7px 14px; border-radius: 8px 8px 0 0; color: var(--ink-2); }
.tab[aria-selected="true"] { background: var(--surface); border-color: var(--line); color: var(--ink); font-weight: 600; margin-bottom: -1px; }
.tab .chip { margin-left: 6px; }
.vtabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.vtab { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 12px; font-size: 13px; }
.vtab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.screen-body { display: flex; gap: 24px; align-items: flex-start; }
.shots { flex: 0 0 auto; width: min(540px, 46%); position: sticky; top: calc(var(--bar-h) + 12px); max-height: calc(100vh - var(--bar-h) - 24px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.shot-set { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
.shot { margin: 0; text-align: center; }
.shot img { width: 250px; max-width: 100%; height: auto; display: block; margin: 6px auto 0; border: 1px solid var(--line); border-radius: 6px; }
.shot figcaption { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--ink-2); }
.shot .missing { width: 250px; max-width: 100%; margin: 6px auto 0; border: 1px dashed var(--line); border-radius: 6px; padding: 40px 8px; color: var(--ink-3); font-size: 13px; }
.shots .caption { text-align: center; color: var(--ink-3); font-size: 13px; margin-top: 10px; }
.reqs { flex: 1 1 0; min-width: 0; }
.req + .req { margin-top: 14px; }
.req h4 .id { color: var(--ink-3); font-weight: 500; margin-right: 6px; }
.changes { margin: 8px 0 0; padding-left: 20px; }
.changes li { margin: 2px 0; }
.tag { font-size: 12px; color: var(--ink-3); margin-left: 6px; }

.delta { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.delta > summary { padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.delta .body { padding: 0 12px 12px; }
.cmp { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: 14px; background: var(--surface); }
.cmp th, .cmp td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.cmp th { background: var(--surface-2); font-weight: 600; color: var(--ink-2); }
.cmp td.empty { color: var(--ink-3); text-align: center; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.choice { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; text-align: left; }
.choice:hover { border-color: var(--accent); }
.choice[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.choice small { display: block; opacity: .85; font-size: 12px; }
.apply-similar { display: block; margin-top: 8px; }
.note { width: 100%; min-height: 56px; margin-top: 6px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); resize: vertical; }
.opts { display: grid; gap: 6px; margin-top: 8px; }
.opt { display: block; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; text-align: left; }
.opt:hover { border-color: var(--accent); }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-bg); }
.opt .cons { display: block; color: var(--ink-3); font-size: 13px; margin-top: 2px; }
.q-head { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: baseline; }
.q-head .qt { font-weight: 600; }
table.plain { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--surface); }
table.plain th, table.plain td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
table.plain th { background: var(--surface-2); color: var(--ink-2); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 4px 12px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.layers { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: flex-start; }
.layer { display: flex; flex-direction: column; gap: 8px; position: relative; }
.layer + .layer::before { content: "\2192"; position: absolute; left: -22px; top: 10px; color: var(--ink-3); }
.node { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; min-width: 150px; max-width: 260px; font-size: 13px; }
.node b { margin-right: 4px; }
.export-box { width: 100%; min-height: 160px; font: 12px/1.5 var(--mono); padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-top: 12px; }
pre.raw { background: var(--surface-2); padding: 10px; border-radius: 8px; overflow: auto; font: 12px/1.5 var(--mono); max-height: 360px; }
ul.plainlist { margin: 6px 0 0; padding-left: 20px; }
.warn-list { list-style: none; margin: 0; padding: 0; }
.warn-list li { padding: 6px 0; border-top: 1px solid var(--line); }
.warn-list li:first-child { border-top: 0; }
code { font-family: var(--mono); font-size: 13px; background: var(--surface-2); padding: 0 4px; border-radius: 4px; }

@media (max-width: 799px) {
  .screen-body { flex-direction: column; align-items: stretch; }
  .reqs { flex: 0 0 auto; }
  .shots { position: static; width: 100%; max-height: none; }
  .cmp thead { display: none; }
  .cmp, .cmp tbody, .cmp tr, .cmp td { display: block; width: 100%; }
  .cmp tr { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; overflow: hidden; }
  .cmp td { border: 0; border-top: 1px solid var(--line); }
  .cmp td:first-child { border-top: 0; background: var(--surface-2); font-weight: 600; }
  .cmp td::before { content: attr(data-label); display: block; font-size: 12px; color: var(--ink-3); font-weight: 600; }
  .cmp td:first-child::before { display: none; }
  .actions { margin-left: 0; }
}
@media print {
  .bar { position: static; }
  .shots { position: static; }
}
</style>
</head>
<body>
<div id="app"></div>
<script type="application/json" id="gate-data">{{GATE_DATA}}</script>
<script id="gate-logic">
/* 게이트 페이지의 순수 로직. DOM 과 저장소를 건드리지 않는다. */
var NOTE_LIMIT = 500;
var SECTION_KEYS = ["answers", "scope", "assumptions", "scenarios"];

function emptyState() {
  return { answers: {}, scope: {}, assumptions: {}, scenarios: {}, plan_requests: [], approvals: {} };
}

function normalizeState(raw) {
  var state = emptyState();
  if (!raw || typeof raw !== "object") return state;
  SECTION_KEYS.forEach(function (key) {
    if (raw[key] && typeof raw[key] === "object" && !Array.isArray(raw[key])) {
      Object.keys(raw[key]).forEach(function (id) {
        if (raw[key][id] && typeof raw[key][id] === "object") state[key][id] = Object.assign({}, raw[key][id]);
      });
    }
  });
  if (Array.isArray(raw.plan_requests)) {
    state.plan_requests = raw.plan_requests.filter(function (r) { return r && typeof r.text === "string"; }).map(function (r) { return Object.assign({}, r); });
  }
  if (raw.approvals && typeof raw.approvals === "object" && !Array.isArray(raw.approvals)) {
    Object.keys(raw.approvals).forEach(function (id) {
      if (raw.approvals[id] && typeof raw.approvals[id] === "object") state.approvals[id] = Object.assign({}, raw.approvals[id]);
    });
  }
  return state;
}

function cloneState(state) {
  return normalizeState(JSON.parse(JSON.stringify(state)));
}

/* a 가 b 보다 늦은 시각인가. b 가 없으면 늦은 것이다. */
function isLaterAt(a, b) {
  if (b === undefined || b === null) return true;
  var x = Date.parse(a);
  var y = Date.parse(b);
  return isFinite(x) && isFinite(y) && x > y;
}

/* 같은 항목은 시각이 늦은 쪽을 쓴다. 시각이 같으면 base 를 둔다. */
function mergeStates(base, local) {
  var a = normalizeState(base);
  var b = normalizeState(local);
  var out = cloneState(a);
  SECTION_KEYS.concat(["approvals"]).forEach(function (key) {
    Object.keys(b[key]).forEach(function (id) {
      var mine = out[key][id];
      if (mine === undefined || isLaterAt(b[key][id].at, mine.at)) out[key][id] = b[key][id];
    });
  });
  b.plan_requests.forEach(function (req) {
    var seen = out.plan_requests.some(function (r) { return r.target === req.target && r.text === req.text && r.at === req.at; });
    if (!seen) out.plan_requests.push(req);
  });
  return out;
}

function trimNote(note) {
  return String(note || "").trim().slice(0, NOTE_LIMIT);
}

function hasAnswerContent(entry) {
  return !!entry && ((entry.option || "").length > 0 || String(entry.text || "").trim().length > 0);
}

/* 답이 있는 질문의 본문이 답한 뒤에 바뀌었는가. 답에 본문 해시가 없으면 바뀌지 않은 것으로 본다. */
function questionSuperseded(question, entry) {
  return hasAnswerContent(entry) && typeof entry.question_hash === "string" && entry.question_hash !== question.hash;
}

function questionOpen(question, entry) {
  return !(hasAnswerContent(entry) && !questionSuperseded(question, entry));
}

function decisionAllowed(rules, kind, decision) {
  var choices = rules.delta_choices[kind] || [];
  return choices.some(function (c) { return c.value === decision; });
}

function deltaOpen(rules, delta, entry) {
  return !(entry && decisionAllowed(rules, delta.kind, entry.decision));
}

function assumptionOpen(entry) {
  return entry === undefined || entry === null;
}

/* 열린 항목: 코어와 같이 질문, 차이, 가정, 시나리오 질문 순이다. */
function computeOpen(model, state) {
  var out = { questions: [], deltas: [], assumptions: [], scenario_questions: [], reanswer: [] };
  model.questions.forEach(function (q) {
    var entry = state.answers[q.id];
    if (questionSuperseded(q, entry)) out.reanswer.push(q.id);
    if (!questionOpen(q, entry)) return;
    (q.source === "scenarios" ? out.scenario_questions : out.questions).push(q.id);
  });
  allDeltas(model).forEach(function (d) {
    if (deltaOpen(model.rules, d, state.scope[d.id])) out.deltas.push(d.id);
  });
  model.assumptions.forEach(function (a) {
    if (assumptionOpen(state.assumptions[a.id])) out.assumptions.push(a.id);
  });
  out.all = out.questions.concat(out.deltas, out.assumptions, out.scenario_questions);
  return out;
}

/* 모델의 모든 차이를 id 번호 순서로 모은다. */
function allDeltas(model) {
  var byId = {};
  var list = [];
  function add(d) {
    if (!byId[d.id]) { byId[d.id] = d; list.push(d); }
  }
  model.screens.forEach(function (s) { s.requirements.forEach(function (r) { r.deltas.forEach(add); }); });
  model.unbound_requirements.forEach(function (r) { r.deltas.forEach(add); });
  model.unbound_deltas.forEach(add);
  return list.sort(function (a, b) { return idNumber(a.id) - idNumber(b.id); });
}

function idNumber(id) {
  var m = /(\d+)$/.exec(id);
  return m ? Number(m[1]) : 0;
}

function computeProgress(model, state) {
  var open = computeOpen(model, state);
  var deltas = allDeltas(model);
  return {
    questions: { answered: model.questions.length - open.questions.length - open.scenario_questions.length, total: model.questions.length },
    deltas: { decided: deltas.length - open.deltas.length, total: deltas.length },
    assumptions: { confirmed: model.assumptions.length - open.assumptions.length, total: model.assumptions.length },
    open: open.all.length
  };
}

function setAnswer(state, question, patch, at) {
  var next = cloneState(state);
  var prev = next.answers[question.id] || {};
  var option = patch.option !== undefined ? patch.option : prev.option || "";
  var text = patch.text !== undefined ? patch.text : prev.text || "";
  if (option === "" && String(text).trim() === "") {
    delete next.answers[question.id];
    return next;
  }
  var entry = { question_hash: question.hash, at: at };
  if (option !== "") entry.option = option;
  if (String(text).trim() !== "") entry.text = String(text).trim();
  next.answers[question.id] = entry;
  return next;
}

/* 결정이 같으면 그대로 둔다. 결정이 바뀌면 메모는 지워진다. */
function setDecision(state, rules, delta, decision, at) {
  if (!decisionAllowed(rules, delta.kind, decision)) return state;
  var prev = state.scope[delta.id];
  if (prev && prev.decision === decision) return state;
  var next = cloneState(state);
  next.scope[delta.id] = { decision: decision, at: at };
  return next;
}

function setDecisionNote(state, deltaId, note, at) {
  var prev = state.scope[deltaId];
  if (!prev) return state;
  var next = cloneState(state);
  var text = trimNote(note);
  var entry = { decision: prev.decision, at: at };
  if (prev.from) entry.from = prev.from;
  if (text !== "") entry.note = text;
  next.scope[deltaId] = entry;
  return next;
}

/* 모델에서 이 차이와 같은 결정으로 묶을 수 있어 보이는 다른 차이들을 id 순서로 꺼낸다. */
function similarDeltas(model, delta) {
  var ids = delta.similar_ids || [];
  return allDeltas(model).filter(function (d) { return d.id !== delta.id && ids.indexOf(d.id) >= 0; });
}

/* 결정을 이 차이와 묶을 수 있어 보이는 차이들에도 같은 결정·같은 시각으로 적용한다. 종류에 허용되지 않는 결정은 그 차이에 적용하지 않는다. */
function setDecisionWithSimilar(state, rules, delta, decision, similar, at) {
  if (!decisionAllowed(rules, delta.kind, decision)) return state;
  var next = cloneState(state);
  var changed = false;
  function put(target, from) {
    var prev = next.scope[target.id];
    if (prev && prev.decision === decision) return;
    var entry = { decision: decision, at: at };
    if (from) entry.from = from;
    next.scope[target.id] = entry;
    changed = true;
  }
  put(delta, null);
  similar.forEach(function (d) {
    if (decisionAllowed(rules, d.kind, decision)) put(d, delta.id);
  });
  return changed ? next : state;
}

function setAssumption(state, id, status, at) {
  var prev = state.assumptions[id];
  if (prev && prev.status === status) return state;
  var next = cloneState(state);
  next.assumptions[id] = { status: status, at: at };
  return next;
}

function setAssumptionNote(state, id, note, at) {
  var prev = state.assumptions[id];
  if (!prev) return state;
  var next = cloneState(state);
  var text = trimNote(note);
  var entry = { status: prev.status, at: at };
  if (text !== "") entry.note = text;
  next.assumptions[id] = entry;
  return next;
}

function effectiveBackend(scenario, state) {
  var entry = state.scenarios[scenario.id];
  return entry ? entry.backend : scenario.backend;
}

function setScenarioBackend(state, scenario, backend, at) {
  if (effectiveBackend(scenario, state) === backend) return state;
  var next = cloneState(state);
  next.scenarios[scenario.id] = { backend: backend, at: at };
  return next;
}

function addPlanRequest(state, target, text, at) {
  var body = String(text || "").trim();
  if (body === "") return state;
  var next = cloneState(state);
  next.plan_requests.push({ target: target, text: body, at: at });
  return next;
}

function approvalKey(revision) {
  return String(revision).slice(0, 12);
}

function approveState(state, revision, at) {
  var next = cloneState(state);
  next.approvals[approvalKey(revision)] = { revision: revision, at: at };
  return next;
}

function isApprovedInState(model, state) {
  var entry = state.approvals[approvalKey(model.head.revision)];
  return !!entry && entry.revision === model.head.revision;
}

/* 승인 단계이고 열린 항목이 없고 아직 승인되지 않았을 때만 승인할 수 있다. */
function canApprove(model, state) {
  return model.head.phase === "approve" && !model.head.approved && computeOpen(model, state).all.length === 0;
}

/* 분해안의 티켓을 의존 순서의 단계(층)로 나눈다. 순환이 있으면 남은 티켓을 마지막 층에 둔다. */
function planLayers(tickets) {

  var placed = {};

  }

      section.append(h("div", { class: "card" }, h("h3", null, "피처플래그"), flag.used
        ? h("div", null, "플래그 " + (flag.name || "(이름 없음)") + " 를 씁니다. 제거 티켓: " + (flag.removal_ticket || "없음"))
        : h("div", { class: "muted" }, "피처플래그를 쓰지 않습니다.")));
    }
    if (plan.excluded.length > 0) {
      var kindLabel = { delta: "차이", requirement: "요구", change: "변경 항목" };
      section.append(h("div", { class: "card" }, h("h3", null, "뺀 항목"),
        h("table", { class: "plain" }, h("thead", null, h("tr", null, h("th", null, "종류"), h("th", null, "대상"), h("th", null, "이유"))),
          h("tbody", null, plan.excluded.map(function (e) { return h("tr", null, h("td", null, kindLabel[e.kind] || e.kind), h("td", null, e.label), h("td", null, e.reason)); })))));
    }
    if (!hasList) section.append(h("div", { class: "card" }, h("p", { class: "muted" }, "티켓과 PR 목록을 읽지 못해 원본을 그대로 보여 줍니다."),
      h("details", { class: "fold", open: true }, h("summary", null, "원본 JSON"), h("pre", { class: "raw" }, JSON.stringify(plan.raw, null, 2)))));

    var target = h("select", { "aria-label": "수정 요청 대상" }, h("option", { value: "전체" }, "전체"),
      plan.tickets.map(function (t) { return h("option", { value: t.id }, "티켓 " + t.id); }), plan.prs.map(function (p) { return h("option", { value: p.id }, "PR " + p.id); }));
    var text = h("textarea", { class: "note", placeholder: "고쳐야 할 점을 적어 주세요", "aria-label": "수정 요청 내용" });
    var sent = h("ul", { class: "plainlist" });
    var form = h("div", { class: "card" }, h("h3", null, "수정 요청"),
      h("div", { class: "row" }, h("span", { class: "muted small" }, "대상"), target),
      text, h("div", { class: "row", style: "margin-top:8px" }, h("button", { class: "btn", type: "button", onclick: function () {
        var next = addPlanRequest(state, target.value, text.value, nowIso());
        if (next !== state) { text.value = ""; commit(next); }
      } }, "수정 요청 추가"), h("span", { class: "muted small" }, "추가한 요청은 답 내보내기에 담깁니다.")), sent);
    onRefresh(function () {
      sent.replaceChildren.apply(sent, state.plan_requests.map(function (r) { return h("li", null, h("b", null, r.target + " "), r.text); }));
    });
    section.append(form);
    return section;
  }

  /* ---------- 갱신과 시작 ---------- */
  function refresh() {
    view.open = computeOpen(model, state);
    view.openSet = {};
    view.open.all.forEach(function (id) { view.openSet[id] = true; });
    updaters.forEach(function (fn) { fn(); });
  }
  function measureBar() {
    var bar = document.querySelector(".bar");
    if (bar) document.documentElement.style.setProperty("--bar-h", bar.offsetHeight + "px");
  }

  var root = document.getElementById("app");
  view.open = computeOpen(model, state);
  view.openSet = {};
  view.open.all.forEach(function (id) { view.openSet[id] = true; });
  buildHeader().forEach(function (el) { root.append(el); });
  var main = h("main", { class: "wrap" }, buildNeeds(), buildScreens(), buildUnbound(), buildQuestions(), buildAssumptions(), buildScope(), buildImpact(), buildScenarios(), buildPlan());
  root.append(main);
  refreshBack();
  refresh();
  var unboundSec = document.getElementById("sec-unbound");
  if (unboundSec && unboundSec.hidden) document.getElementById("nav-sec-unbound").hidden = true;
  measureBar();
  window.addEventListener("resize", measureBar);
  if (typeof ResizeObserver === "function") new ResizeObserver(measureBar).observe(document.querySelector(".bar"));
})();
</script>
</body>
</html>
